name: bot-aging

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.TEAM_KB_APP_ID }}
          private-key: ${{ secrets.TEAM_KB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project bot
      - run: git config user.name team-kb-bot && git config user.email team-kb-bot@users.noreply.github.com
      - run: uv run --project bot python bot/runner.py aging_scan
        env:
          TEAM_KB_REPO: ${{ github.workspace }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}