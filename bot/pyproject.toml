[project]
name = "team-kb-bot"
version = "0.1.0"
description = "Autonomous maintenance bot for team-kb"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../mcp-server"]
testpaths = ["tests"]